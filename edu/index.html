<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数学可视化学习平台 — 总目录</title>
    <style>
      :root {
        --bg: #070b14;
        --text: #e8edf7;
        --muted: #9aa7bd;
        --border: rgba(255, 255, 255, 0.08);
        --card: rgba(255, 255, 255, 0.045);
        --accent: #7c8cff;
        --accent-2: #4be3c1;
        --accent-3: #ff7ac3;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        min-height: 100vh;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* --- 背景：柔和极光光斑 + 微噪点 --- */
      body::before {
        content: "";
        position: fixed;
        inset: -20%;
        z-index: -2;
        background:
          radial-gradient(38% 42% at 18% 12%, rgba(124, 140, 255, 0.28), transparent 62%),
          radial-gradient(34% 40% at 82% 18%, rgba(75, 227, 193, 0.18), transparent 60%),
          radial-gradient(42% 46% at 68% 86%, rgba(255, 122, 195, 0.16), transparent 62%),
          radial-gradient(30% 32% at 8% 80%, rgba(124, 140, 255, 0.14), transparent 60%);
        filter: blur(30px);
        animation: aurora 18s ease-in-out infinite alternate;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(to bottom, black, transparent 82%);
        -webkit-mask-image: linear-gradient(to bottom, black, transparent 82%);
      }

      @keyframes aurora {
        0% {
          transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        }
        50% {
          transform: translate3d(2%, -3%, 0) rotate(6deg) scale(1.06);
        }
        100% {
          transform: translate3d(-2%, 2%, 0) rotate(-5deg) scale(1.02);
        }
      }

      /* --- Header --- */
      header {
        text-align: center;
        padding: 96px 20px 44px;
        position: relative;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 26px;
        backdrop-filter: blur(8px);
      }

      .badge .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-2);
        box-shadow: 0 0 10px var(--accent-2);
        animation: pulse 2.2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.55;
          transform: scale(0.82);
        }
      }

      header h1 {
        font-size: clamp(2.2rem, 5.2vw, 3.6rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.12;
        background: linear-gradient(100deg, #ffffff 8%, #b9c6ff 38%, var(--accent-2) 72%, #ffd1ec 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 18px;
      }

      header p {
        font-size: 1.08rem;
        color: var(--muted);
        max-width: 520px;
        margin: 0 auto;
        letter-spacing: 0.01em;
      }

      header p.updated {
        font-size: 0.86rem;
        color: rgba(154, 167, 189, 0.65);
        margin-top: 14px;
      }

      /* --- 卡片网格 --- */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 22px;
        max-width: 900px;
        margin: 0 auto;
        padding: 10px 24px 72px;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        gap: 14px;
        padding: 26px 24px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: var(--card);
        backdrop-filter: blur(14px);
        text-decoration: none;
        color: inherit;
        overflow: hidden;
        isolation: isolate;
        transition:
          transform 0.28s cubic-bezier(0.2, 0.8, 0.3, 1),
          border-color 0.28s,
          box-shadow 0.28s;
        animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.3, 1) backwards;
      }

      .card:nth-child(2) {
        animation-delay: 0.08s;
      }
      .card:nth-child(3) {
        animation-delay: 0.16s;
      }
      .card:nth-child(4) {
        animation-delay: 0.24s;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 悬浮光晕 */
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: radial-gradient(
          90% 80% at 50% 0%,
          rgba(124, 140, 255, 0.22),
          transparent 60%
        );
        opacity: 0;
        transition: opacity 0.3s;
      }

      .card::after {
        content: "→";
        position: absolute;
        right: 20px;
        bottom: 18px;
        font-size: 1.1rem;
        color: var(--muted);
        opacity: 0;
        transform: translateX(-8px);
        transition:
          opacity 0.3s,
          transform 0.3s;
      }

      .card:hover {
        transform: translateY(-6px);
        border-color: rgba(124, 140, 255, 0.5);
        box-shadow: 0 18px 44px rgba(8, 12, 24, 0.55);
      }

      .card:hover::before {
        opacity: 1;
      }

      .card:hover::after {
        opacity: 1;
        transform: translateX(0);
      }

      .card .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        font-size: 1.6rem;
        background: linear-gradient(135deg, rgba(124, 140, 255, 0.28), rgba(75, 227, 193, 0.18));
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: transform 0.28s;
      }

      .card:hover .icon {
        transform: scale(1.08) rotate(-4deg);
      }

      .card .name {
        font-size: 1.16rem;
        font-weight: 650;
        color: #f4f7fd;
        letter-spacing: 0.01em;
      }

      .card .desc {
        font-size: 0.88rem;
        color: var(--muted);
        line-height: 1.55;
      }

      /* --- Footer --- */
      footer {
        text-align: center;
        padding: 8px 20px 52px;
        color: rgba(154, 167, 189, 0.55);
        font-size: 0.85rem;
        letter-spacing: 0.02em;
      }

      /* --- 无障碍：减弱动效 --- */
      @media (prefers-reduced-motion: reduce) {
        body::before,
        .badge .dot {
          animation: none;
        }
        .card {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="badge"><span class="dot"></span>可视化 · 交互 · 探索</span>
      <h1>数学可视化学习平台</h1>
      <p>选择学科方向，在图形与动效中理解数学与物理</p>
      <p class="updated">最后更新：2026-10-15</p>
    </header>

    <div class="grid">
      <a class="card" href="math/k6/index.html">
        <span class="icon">📐</span>
        <span class="name">K6 小学数学</span>
        <span class="desc">乘法 · 除法 · 分数 · 几何</span>
      </a>

      <a class="card" href="math/middle-school/index.html">
        <span class="icon">📈</span>
        <span class="name">初中数学函数</span>
        <span class="desc">一次函数 · 二次函数 · 三次函数</span>
      </a>

      <a class="card" href="physics/k9/index.html">
        <span class="icon">⚡</span>
        <span class="name">初中物理</span>
        <span class="desc">功和机械能 · 更多章节更新中</span>
      </a>

      <a class="card" href="roulette.html">
        <span class="icon">🎯</span>
        <span class="name">轮盘挑战</span>
        <span class="desc">随机抽奖 · 转到什么做什么</span>
      </a>
    </div>

    <footer>
      <p>数学可视化学习平台 &copy; 2026 — 持续更新中</p>
    </footer>
  </body>
</html>

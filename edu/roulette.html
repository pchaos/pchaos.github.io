<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>挑战轮盘</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #26263f;
    --panel-border: #3a3a5c;
    --text: #e8e8f0;
    --muted: #9a9ab0;
    --accent: #ff5e5e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: radial-gradient(circle at 50% 30%, #22224a, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
  }
  .wheel-wrap { position: relative; width: min(79.2vw, 462px); aspect-ratio: 1; }
  canvas#wheel { width: 100%; height: 100%; display: block; filter: drop-shadow(0 8px 24px rgba(0,0,0,.45)); }
  /* 顶部指针 */
  .pointer {
    position: absolute; top: -6%; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 34px solid var(--accent);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
    z-index: 2;
  }
  .center-hub {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 22%; height: 22%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #c9c9de 40%, #8b8baa);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #33334d;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    z-index: 2;
  }
  #result {
    min-height: 1.6em;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    text-align: center;
    letter-spacing: .04em;
  }
  #result .hit { color: var(--accent); }
  /* 幸运星附体提示 */
  #lucky {
    position: fixed; inset: 0; z-index: 50;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    background: rgba(10, 10, 30, .72);
    backdrop-filter: blur(3px);
    text-align: center;
  }
  #lucky.show { display: flex; }
  #lucky .star {
    font-size: clamp(3.5rem, 10vw, 6rem);
    animation: star-pulse 1.1s ease-in-out infinite;
  }
  #lucky .msg {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    font-weight: 800;
    color: #ffd700;
    letter-spacing: .1em;
    text-shadow: 0 0 24px rgba(255, 215, 0, .6);
  }
  #lucky.bad .msg {
    color: #ff4d4d;
    text-shadow: 0 0 24px rgba(255, 77, 77, .7);
  }
  #lucky .sub {
    font-size: clamp(.9rem, 2.5vw, 1.1rem);
    color: var(--muted);
  }
  @keyframes star-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }
  button#spin {
    padding: 14px 48px;
    font-size: 1.2rem;
    font-weight: 700;
    border: none;
    border-radius: 40px;
    background: linear-gradient(135deg, #ff7a59, var(--accent));
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(255, 94, 94, .35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button#spin:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(255,94,94,.45); }
  button#spin:active { transform: translateY(0); }
  button#spin:disabled { opacity: .5; cursor: default; transform: none; }
  button#countdownBtn {
    padding: 14px 20px;
    font-size: 1.1rem;
    font-weight: 700;
    border: 2px solid var(--panel-border);
    border-radius: 40px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, opacity .12s ease;
  }
  button#countdownBtn:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
  button#countdownBtn:active:not(:disabled) { transform: translateY(0); }
  button#countdownBtn:disabled { opacity: .5; cursor: default; transform: none; }
  button#countdownBtn:not(.ready):not(.running) { display: none; }
  button#regretBtn {
    padding: 14px 20px;
    font-size: 1.1rem;
    font-weight: 700;
    border: 2px solid var(--panel-border);
    border-radius: 40px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, opacity .12s ease;
    display: none;
  }
  button#regretBtn.show { display: inline-block; }
  button#regretBtn:hover:not(:disabled) { transform: translateY(-2px); border-color: #ffd700; }
  button#regretBtn:active:not(:disabled) { transform: translateY(0); }
  button#regretBtn:disabled { opacity: .5; cursor: default; transform: none; }
  /* 转盘中央倒计时浮层 */
  #countdown {
    position: absolute; inset: 0; z-index: 3;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    background: rgba(15, 15, 38, .82);
    backdrop-filter: blur(2px);
    border-radius: 50%;
    text-align: center;
    pointer-events: none;
  }
  #countdown.show { display: flex; }
  #countdown .cd-num {
    font-size: clamp(3rem, 13vw, 6.5rem);
    font-weight: 900; line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 30px rgba(255, 94, 94, .55);
    font-variant-numeric: tabular-nums;
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
  }
  #countdown .cd-num:hover { filter: brightness(1.25); }
  #countdown .cd-name {
    font-size: clamp(.85rem, 2.8vw, 1.05rem);
    color: var(--muted);
    max-width: 82%;
  }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; }
  .controls .spin-cell { grid-column: 2; justify-self: center; display: flex; gap: 14px; align-items: center; }
  .controls .left-cell { grid-column: 1; justify-self: end; display: flex; gap: 14px; align-items: center; }
  .controls .right-cell { grid-column: 3; justify-self: start; display: flex; gap: 14px; align-items: center; }
  button#historyBtn {
    padding: 7px 12px;
    font-size: 0.6rem;
    font-weight: 700;
    border: 2px solid var(--panel-border);
    border-radius: 20px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  button#historyBtn:hover { transform: translateY(-2px); border-color: var(--accent); }
  #historyPanel {
    width: min(90vw, 420px);
    max-height: 46vh;
    overflow-y: auto;
    background: var(--panel);
    border: 2px solid var(--panel-border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  #historyPanel.hidden { display: none; }
  #historyPanel .history-title {
    font-weight: 800;
    font-size: 1.05rem;
    margin-bottom: 10px;
    color: var(--accent);
  }
  #historyList { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  #historyList li {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: .95rem;
    padding: 6px 10px;
    background: rgba(255,255,255,.05);
    border-radius: 8px;
  }
  #historyList li .h-time { color: var(--muted); font-size: .8rem; white-space: nowrap; }
  #historyList li .h-item { font-weight: 600; }
  #historyList li .h-note { color: var(--muted); font-size: .82rem; }
</style>
</head>
<body>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel"></canvas>
    <div class="center-hub" id="hub">GO</div>
    <div id="countdown">
      <div class="cd-num">3</div>
      <div class="cd-name"></div>
    </div>
  </div>

  <div id="result">点击「开转」开始</div>
  <div class="controls">
    <div class="left-cell">
      <button id="countdownBtn" title="抽中带时间的项目后，点击此处从 3 开始倒计时">⏱ 倒计时</button>
    </div>
    <div class="spin-cell">
      <button id="spin">开转</button>
      <button id="regretBtn" title="使用反悔机会，跳过本次结果重新开转">↩️ 反悔重开</button>
    </div>
    <div class="right-cell">
      <button id="historyBtn" title="最近 10 次抽奖记录">🕘 历史</button>
    </div>
  </div>

  <!-- 历史面板 -->
  <div id="historyPanel" class="hidden">
    <div class="history-title">最近 10 次抽奖</div>
    <ul id="historyList"></ul>
  </div>

  <!-- 幸运星附体提示 -->
  <div id="lucky">
    <div class="star">⭐</div>
    <div class="msg">幸运星附体</div>
    <div class="sub">连续抽中优惠券效果累乘（8折↔12折），自动开转下一轮</div>
  </div>

<script>
/* ===== 条目：从 options.js 加载（每行：名称|数量|规则，支持 ,regret / ,factor:0.8 修饰符） ===== */
const ITEMS = (function () {
  const fallback = [
    { name: "金鸡独立", amount: "60秒",  rule: "单脚支撑，除了支撑脚，肢体不能触碰任何外物" },
    { name: "弓步",     amount: "60秒",  rule: "大腿和地面平行，手不能接触外物，身体笔直垂直于地面" },
    { name: "仰卧起坐", amount: "45个",  rule: "每次头碰膝盖，背部要着地" },
    { name: "俯卧撑",   amount: "30个",  rule: "身体平直，起来时手臂伸直，下去时胸部离地面五厘米以内" },
    { name: "平板支撑", amount: "60秒",  rule: "身体平直，保持不动" },
    { name: "仰卧推起成桥", amount: "60秒", rule: "仰卧，用手推起身体成桥状，保持姿势" },
    { name: "深蹲",     amount: "50个",  rule: "" },
    { name: "马步",     amount: "60秒",  rule: "大腿与地面保持平行，小腿与地面保持垂直，身体笔直垂直于地面" },
    { name: "独立思考", amount: "600秒", rule: "自己翻书或者查看资料，独立思考" },
    { name: "观看教学视频", amount: "",  rule: "" },
    { name: "找错字", amount: "", rule: "在文章/文字中找出所有错别字" },
    { name: "反悔一次的机会", amount: "", rule: "获得一次反悔机会：下次抽中不想执行的项目，可点「反悔重开」跳过并重新开转（不叠加）", regret: true },
    { name: "8折优惠券", amount: "", rule: "下一轮抽奖执行数量打8折", factor: 0.8 },
    { name: "12折优惠券", amount: "", rule: "下一轮抽奖执行数量加收12折", factor: 1.2 },
  ];
  try {
    const req = new XMLHttpRequest();
    req.open("GET", "options.js", false); // 同步加载，保证页面渲染前 ITEMS 就绪
    req.send(null);
    if (req.status !== 200) return fallback;
    const items = [];
    for (const line of req.responseText.split("\n")) {
      const l = line.trim();
      if (!l || l.startsWith("#") || l.startsWith("//")) continue;
      const parts = l.split("|");
      if (parts.length < 1) continue;
      const name = (parts[0] || "").trim();
      if (!name) continue;
      const amount = parts.length > 1 ? parts[1].trim() : "";
      let rule = parts.length > 2 ? parts[2].trim() : "";
      const item = { name, amount, rule };
      // 修饰符：rule 尾部 ,regret / ,factor:0.8 / ,factor:1.2
      const m = rule.match(/,factor:([\d.]+)$/);
      if (m) { item.factor = parseFloat(m[1]); rule = rule.slice(0, m.index); }
      if (/,regret$/.test(rule)) { item.regret = true; rule = rule.replace(/,regret$/, ""); }
      item.rule = rule.trim();
      items.push(item);
    }
    return items.length ? items : fallback;
  } catch (e) {
    return fallback; // file:// 或文件缺失时兜底
  }
})();

const COLORS = [
  "#ff6b6b", "#ffa94d", "#ffd43b", "#51cf66",
  "#22b8cf", "#748ffc", "#b197fc", "#f783ac",
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const resultEl = document.getElementById("result");
const spinBtn = document.getElementById("spin");

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let size = 0;
let currentAngle = 0; // 当前扇区0的中线指向的角度（rad）
let spinning = false;
let couponFactor = 1; // 连续优惠券累乘：<1 打折、>1 加量；抽到普通项目后恢复 1
let luckyStreak = 0;  // 连续抽中 8折券次数（12折券打断）
let freePass = false; // 连续 3 次 8折赠送「免做一次大礼」：下一轮普通项目免做
let regretChance = false; // 反悔一次的机会：抽中道具后获得，跳过下次不想执行的项目
let spinHistory = [];  // 最近 10 次抽奖记录 [{time, item, note}]
let countdownSeconds = 0; // 当前待倒计时项目时长（秒）
let countdownRunning = false; // 倒计时进行中

function resize() {
  size = canvas.parentElement.clientWidth;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + "px";
  canvas.style.height = size + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

const slice = () => 2 * Math.PI / ITEMS.length;

function draw() {
  const c = size / 2;
  const r = size / 2 - 2;
  ctx.clearRect(0, 0, size, size);
  for (let i = 0; i < ITEMS.length; i++) {
    const item = ITEMS[i];
    const start = currentAngle + i * slice();
    ctx.beginPath();
    ctx.moveTo(c, c);
    ctx.arc(c, c, r, start, start + slice());
    ctx.closePath();
    ctx.fillStyle = item.factor
      ? (item.factor < 1 ? "#f5c518" : "#c0392b")
      : COLORS[i % COLORS.length];
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.35)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // 文字：沿半径方向居中，两行（名称 / 数量），白字+深色描边保证对比度
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(start + slice() / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    const f1 = Math.max(12, r * 0.115);
    const f2 = Math.max(11, r * 0.095);
    ctx.lineWidth = 4;
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(0,0,0,.55)";
    ctx.fillStyle = "#fff";
    ctx.font = "700 " + f1 + "px system-ui, sans-serif";
    ctx.strokeText(clip(item.name, r * 0.8, f1), r * 0.88, -f1 * 0.42);
    ctx.fillText(clip(item.name, r * 0.8, f1), r * 0.88, -f1 * 0.42);
    if (item.amount) {
      ctx.font = "700 " + f2 + "px system-ui, sans-serif";
      ctx.strokeText(clip(item.amount, r * 0.8, f2), r * 0.88, f2 * 0.75);
      ctx.fillText(clip(item.amount, r * 0.8, f2), r * 0.88, f2 * 0.75);
    }
    ctx.restore();
  }
  // 外圈
  ctx.beginPath();
  ctx.arc(c, c, r, 0, 2 * Math.PI);
  ctx.lineWidth = 6;
  ctx.strokeStyle = "#d9d9ec";
  ctx.stroke();
}

function clip(s, maxWidth, fontSize) {
  const maxLen = Math.max(2, Math.floor(maxWidth / (fontSize * 0.55)));
  return s.length > maxLen ? s.slice(0, maxLen - 1) + "…" : s;
}

function spin() {
  if (spinning || ITEMS.length < 1) return;
  spinning = true;
  spinBtn.disabled = true;
  resultEl.textContent = "转动中…";
  // 新一轮开转，清掉上一轮的待倒计时状态
  resetCountdownReady();
  // 反悔机会持有期间按钮常驻；转动中禁用防误点
  if (regretChance) {
    regretBtn.classList.add("show");
  }
  regretBtn.disabled = true;

  // 上轮（或连续多轮）抽中优惠券的累计系数；本轮抽到普通项目后即恢复原值
  const usingCoupon = couponFactor !== 1;
  const factor = usingCoupon ? couponFactor : 1;

  // 圈数必须是整数：小数圈会把多余角度留在最终位置，导致指针与结果错位
  // 加密安全随机数（crypto.getRandomValues），替代 Math.random 伪随机
  const randU32 = new Uint32Array(2);
  crypto.getRandomValues(randU32);
  const extraTurns = 5 + (randU32[0] % 5); // 5-9 整圈
  const targetSlice = randU32[1] % ITEMS.length;
  // 目标扇区中线相对轮盘 0° 的偏移，最终让该中线对准顶部指针（-PI/2）
  const sliceMidOffset = targetSlice * slice() + slice() / 2;
  const targetFinal = -(Math.PI / 2) - sliceMidOffset;
  let delta = targetFinal - currentAngle;
  while (delta <= 0) delta += 2 * Math.PI;
  delta += extraTurns * 2 * Math.PI;

  const start = currentAngle;
  const total = delta;
  const duration = 4200;
  const t0 = performance.now();

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function step(now) {
    const p = Math.min((now - t0) / duration, 1);
    currentAngle = start + total * easeOutCubic(p);
    draw();
    if (p < 1) {
      requestAnimationFrame(step);
    } else {
      currentAngle = currentAngle % (2 * Math.PI);
      spinning = false;
      spinBtn.disabled = false;
      const item = ITEMS[targetSlice];
      // 优惠券系数：数量数值部分 ×factor（<1 折扣、>1 加收），保留原有单位（秒/个）
      let amountText = item.amount;
      let couponNote = "";
      if (usingCoupon && !item.factor && item.amount) {
        const orig = item.amount;
        const m = orig.match(/^([\d.]+)(.*)$/);
        if (m) {
          const calc = Math.round(parseFloat(m[1]) * factor);
          if (calc !== parseFloat(m[1])) {
            amountText = calc + m[2];
            const label = factor < 1
              ? (factor === 0.8 ? "8折" : (Math.round(factor * 1000) / 100) + "折")
              : (factor === 1.2 ? "12折" : (Math.round(factor * 1000) / 100) + "折");
            couponNote = "（" + label + "：" + orig + " → " + amountText + "）";
          }
        }
      }
      // 普通项目消费优惠后恢复原值（无数量项目同样清零）；同时打断 8折连击
      if (!item.factor) {
        couponFactor = 1;
        luckyStreak = 0;
      }
      // 反悔道具：获得一次反悔机会（不叠加），显示提示后继续可开转
      if (item.regret) {
        regretChance = true;
        recordHistory(item.name, "获得反悔机会");
        resultEl.innerHTML = "↩️ 抽中：<span class='hit'>" + escapeHtml(item.name)
          + "</span>　" + escapeHtml(item.rule);
        updateRegretBtn(); // 机会刚获得，按钮立即可用
        return;
      }
      if (item.factor) {
        couponFactor *= item.factor;
        // 连击计数：8折券 +1，12折券清零
        if (item.factor < 1) {
          luckyStreak++;
        } else {
          luckyStreak = 0;
        }
        // 结果区记录本次抽中优惠券
        resultEl.innerHTML = "🎉 抽中：<span class='hit'>" + escapeHtml(item.name)
          + "</span>　" + escapeHtml(item.rule);
        // 幸运星/霉运附体：显示提示并自动触发下一轮
        const lucky = document.getElementById("lucky");
        const isLucky = item.factor < 1;
        lucky.classList.toggle("bad", !isLucky);
        lucky.querySelector(".star").textContent = isLucky ? "⭐" : "☠️";
        lucky.querySelector(".msg").textContent = isLucky ? "幸运星附体" : "霉运上身";
        lucky.classList.add("show");
        // 持有反悔机会：不自动重开，由用户自主决定反悔或手动开转
        if (regretChance) {
          setTimeout(() => lucky.classList.remove("show"), 1500);
          updateRegretBtn();
        } else {
          setTimeout(() => {
            lucky.classList.remove("show");
            spin();
          }, 1500);
        }
        // 连续 3 张 8折券：赠送免做一次大礼
        if (item.factor < 1 && luckyStreak >= 3) {
          freePass = true;
          luckyStreak = 0; // 免做奖励后连击重新计数
          resultEl.innerHTML += "<br>🎁 <span style='color:#ffd700'>免做一次大礼！</span>下一轮抽中项目自动免做";
          recordHistory(item.name, "大礼·免做一次");
        } else {
          recordHistory(item.name, item.factor < 1 ? "8折" : "12折");
        }
        return;
      }
      // 免做：连续 3 张 8折券赠送，本轮普通项目直接豁免
      if (freePass) {
        freePass = false;
        recordHistory(item.name + (item.amount ? " " + item.amount : ""), "免做");
        resultEl.innerHTML = "🛡 <span class='hit'>免做：</span>" + escapeHtml(item.name)
          + (item.amount ? "　" + escapeHtml(item.amount) : "")
          + "　<em>大礼生效，本轮无需执行</em>";
        return;
      }
      const ruleText = item.rule ? "　" + item.rule : "";
      // 抽中带「秒」的项目：激活倒计时按钮（时长按优惠券换算后的数值）
      const secMatch = amountText.match(/^([\d.]+)秒$/);
      if (secMatch) {
        armCountdown(item.name, Math.round(parseFloat(secMatch[1])));
      }
      updateRegretBtn(); // 结果已定，反悔按钮恢复可点
      recordHistory(item.name + (amountText ? " " + amountText : ""), couponNote.replace(/[（）]/g, ""));
      resultEl.innerHTML = "🎉 抽中：<span class='hit'>" + escapeHtml(item.name)
        + (amountText ? "　" + escapeHtml(amountText) : "")
        + "</span>" + escapeHtml(ruleText) + escapeHtml(couponNote);
    }
  }
  requestAnimationFrame(step);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

/* ===== 倒计时 ===== */
const countdownBtn = document.getElementById("countdownBtn");
const regretBtn = document.getElementById("regretBtn");
const countdownEl = document.getElementById("countdown");
const cdNumEl = countdownEl.querySelector(".cd-num");
const cdNameEl = countdownEl.querySelector(".cd-name");
let countdownItemName = ""; // 当前待倒计时项目名称

let countdownTimer = null; // 当前倒计时的定时器（null 且在运行中 = 暂停）
let countdownPaused = false; // 是否处于暂停状态
let cdRemaining = 3;    // 倒数三秒阶段剩余值
let cdNow = 0;          // 项目倒计时剩余秒数
let cdProject = false;  // 是否已进入项目倒计时阶段

/* ===== 结束提示音 ===== */
let audioCtx = null;

// 在用户点击「倒计时」的手势内创建/恢复音频上下文（浏览器自动播放策略要求）
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

// 结束提示音：三声上升音（660→880→1320Hz），每声 0.18s，间隔 0.22s
function playEndBeep() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const freqs = [660, 880, 1320];
  for (let i = 0; i < freqs.length; i++) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freqs[i];
    gain.gain.setValueAtTime(0.001, t0 + i * 0.4);
    gain.gain.exponentialRampToValueAtTime(0.4, t0 + i * 0.4 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.4 + 0.18);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0 + i * 0.4);
    osc.stop(t0 + i * 0.4 + 0.2);
  }
}

function resetCountdownReady() {
  if (countdownTimer) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }
  countdownPaused = false;
  countdownRunning = false;
  countdownSeconds = 0;
  countdownItemName = "";
  countdownEl.classList.remove("show");
  countdownBtn.classList.remove("ready");
  countdownBtn.classList.remove("running");
  countdownBtn.textContent = "⏱ 倒计时";
  countdownBtn.disabled = true;
}

// 抽中带时间的项目后，激活「倒计时」按钮
function armCountdown(name, seconds) {
  countdownItemName = name;
  countdownSeconds = seconds;
  countdownBtn.classList.add("ready");
  countdownBtn.disabled = false;
}

// 点击「倒计时」：先在转盘位置倒数 3 秒，随后每秒递减显示项目剩余时长
function startCountdown() {
  if (countdownRunning || countdownSeconds <= 0 || spinning) return;
  ensureAudio(); // 用户手势内激活音频上下文，倒计时结束才能响铃
  countdownRunning = true;
  countdownPaused = false;
  countdownBtn.disabled = true;
  countdownBtn.classList.remove("ready");
  countdownBtn.classList.add("running");
  countdownBtn.textContent = "⏸ 暂停";
  const total = countdownSeconds;
  cdRemaining = 3;
  cdNow = total;
  cdProject = false;
  cdNumEl.textContent = cdRemaining;
  cdNameEl.textContent = "";
  countdownEl.classList.add("show");
  startTickLoop();
}

// 每秒递减一次；pauseCountdown() 会清掉定时器并记录暂停状态
function startTickLoop() {
  countdownTimer = setInterval(() => {
    if (countdownPaused) return; // 防御：理论上暂停时定时器已清
    if (!cdProject) {
      // 倒数三秒：3 → 2 → 1
      cdRemaining--;
      if (cdRemaining === 0) {
        // 倒数结束，从项目完整时长开始计时
        cdProject = true;
        cdNumEl.textContent = cdNow;
        cdNameEl.textContent = "剩余 " + countdownItemName + " " + countdownSeconds + " 秒";
      } else {
        cdNumEl.textContent = cdRemaining;
      }
      return;
    }
    // 项目倒计时中
    cdNow--;
    if (cdNow <= 0) {
      clearInterval(countdownTimer);
      countdownTimer = null;
      playEndBeep();       // 计时结束：声音提醒
      resetCountdownReady();
      return;
    }
    cdNumEl.textContent = cdNow;
  }, 1000);
}

// 暂停：停表并冻结当前显示
function pauseCountdown() {
  if (!countdownRunning || countdownPaused) return;
  if (countdownTimer) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }
  countdownPaused = true;
  countdownBtn.textContent = "▶ 继续";
  countdownBtn.disabled = false;
  cdNameEl.textContent = "已暂停 · " + (cdProject ? "剩余 " + countdownItemName + " " + cdNow + " 秒" : "倒计时待开始");
}

// 恢复：从暂停位置继续走表
function resumeCountdown() {
  if (!countdownRunning || !countdownPaused) return;
  countdownPaused = false;
  countdownBtn.disabled = true;
  countdownBtn.textContent = "⏸ 暂停";
  if (cdProject) {
    cdNameEl.textContent = "剩余 " + countdownItemName + " " + countdownSeconds + " 秒";
  } else {
    cdNameEl.textContent = "";
  }
  startTickLoop();
}

// 反悔机会持有 → 显示并启用按钮；否则隐藏
function updateRegretBtn() {
  if (regretChance) {
    regretBtn.classList.add("show");
    regretBtn.disabled = false;
  } else {
    regretBtn.classList.remove("show");
    regretBtn.disabled = true;
  }
}

// 反悔：消费一次反悔机会，跳过本次结果重新开转
function useRegret() {
  if (!regretChance || spinning) return;
  regretChance = false;
  regretBtn.classList.remove("show");
  regretBtn.disabled = true;
  // 最新一条历史标注「反悔跳过」
  if (spinHistory.length) {
    const h = spinHistory[0];
    h.note = (h.note ? h.note + " · " : "") + "反悔跳过";
    renderHistory();
  }
  resetCountdownReady(); // 清掉为被跳过项目准备的倒计时
  spin();
}

// 记录最近 10 次抽奖（最新在前）
function recordHistory(item, note) {
  const now = new Date();
  const time = now.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  spinHistory.unshift({ time, item, note });
  if (spinHistory.length > 10) spinHistory.pop();
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById("historyList");
  list.innerHTML = "";
  for (const h of spinHistory) {
    const li = document.createElement("li");
    const left = document.createElement("span");
    left.className = "h-item";
    left.textContent = h.item;
    const right = document.createElement("span");
    right.className = "h-note";
    right.textContent = (h.note ? h.note + " · " : "") + h.time;
    li.appendChild(left);
    li.appendChild(right);
    list.appendChild(li);
  }
}

const historyBtn = document.getElementById("historyBtn");
const historyPanel = document.getElementById("historyPanel");
historyBtn.addEventListener("click", () => {
  historyPanel.classList.toggle("hidden");
});
// 点击面板外部关闭
document.addEventListener("click", (e) => {
  if (!historyPanel.classList.contains("hidden") &&
      !historyPanel.contains(e.target) &&
      !historyBtn.contains(e.target)) {
    historyPanel.classList.add("hidden");
  }
});

spinBtn.addEventListener("click", spin);
regretBtn.addEventListener("click", useRegret);
countdownBtn.addEventListener("click", () => {
  if (countdownRunning) {
    // 运行中：按钮 = 暂停/继续
    countdownPaused ? resumeCountdown() : pauseCountdown();
  } else {
    startCountdown();
  }
});
// 双击倒计时数字同样暂停/继续
cdNumEl.addEventListener("dblclick", () => {
  if (!countdownRunning) return;
  countdownPaused ? resumeCountdown() : pauseCountdown();
});
window.addEventListener("resize", resize);
resize();
</script>

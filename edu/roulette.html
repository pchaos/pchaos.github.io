<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轮盘赌</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #26263f;
    --panel-border: #3a3a5c;
    --text: #e8e8f0;
    --muted: #9a9ab0;
    --accent: #ff5e5e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: radial-gradient(circle at 50% 30%, #22224a, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
  }
  .wheel-wrap { position: relative; width: min(79.2vw, 462px); aspect-ratio: 1; }
  canvas#wheel { width: 100%; height: 100%; display: block; filter: drop-shadow(0 8px 24px rgba(0,0,0,.45)); }
  /* 顶部指针 */
  .pointer {
    position: absolute; top: -6%; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 34px solid var(--accent);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
    z-index: 2;
  }
  .center-hub {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 22%; height: 22%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #c9c9de 40%, #8b8baa);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #33334d;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    z-index: 2;
  }
  #result {
    min-height: 1.6em;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    text-align: center;
    letter-spacing: .04em;
  }
  #result .hit { color: var(--accent); }
  /* 幸运星附体提示 */
  #lucky {
    position: fixed; inset: 0; z-index: 50;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    background: rgba(10, 10, 30, .72);
    backdrop-filter: blur(3px);
    text-align: center;
  }
  #lucky.show { display: flex; }
  #lucky .star {
    font-size: clamp(3.5rem, 10vw, 6rem);
    animation: star-pulse 1.1s ease-in-out infinite;
  }
  #lucky .msg {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    font-weight: 800;
    color: #ffd700;
    letter-spacing: .1em;
    text-shadow: 0 0 24px rgba(255, 215, 0, .6);
  }
  #lucky.bad .msg {
    color: #ff4d4d;
    text-shadow: 0 0 24px rgba(255, 77, 77, .7);
  }
  #lucky .sub {
    font-size: clamp(.9rem, 2.5vw, 1.1rem);
    color: var(--muted);
  }
  @keyframes star-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }
  button#spin {
    padding: 14px 48px;
    font-size: 1.2rem;
    font-weight: 700;
    border: none;
    border-radius: 40px;
    background: linear-gradient(135deg, #ff7a59, var(--accent));
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(255, 94, 94, .35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button#spin:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(255,94,94,.45); }
  button#spin:active { transform: translateY(0); }
  button#spin:disabled { opacity: .5; cursor: default; transform: none; }
  .controls { display: flex; gap: 14px; align-items: center; }
  button#historyBtn {
    padding: 7px 12px;
    font-size: 0.6rem;
    font-weight: 700;
    border: 2px solid var(--panel-border);
    border-radius: 20px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  button#historyBtn:hover { transform: translateY(-2px); border-color: var(--accent); }
  #historyPanel {
    width: min(90vw, 420px);
    max-height: 46vh;
    overflow-y: auto;
    background: var(--panel);
    border: 2px solid var(--panel-border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  #historyPanel.hidden { display: none; }
  #historyPanel .history-title {
    font-weight: 800;
    font-size: 1.05rem;
    margin-bottom: 10px;
    color: var(--accent);
  }
  #historyList { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  #historyList li {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: .95rem;
    padding: 6px 10px;
    background: rgba(255,255,255,.05);
    border-radius: 8px;
  }
  #historyList li .h-time { color: var(--muted); font-size: .8rem; white-space: nowrap; }
  #historyList li .h-item { font-weight: 600; }
  #historyList li .h-note { color: var(--muted); font-size: .82rem; }
</style>
</head>
<body>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel"></canvas>
    <div class="center-hub" id="hub">GO</div>
  </div>

  <div id="result">点击「开转」开始</div>
  <div class="controls">
    <button id="spin">开转</button>
    <button id="historyBtn" title="最近 10 次抽奖记录">🕘 历史</button>
  </div>

  <!-- 历史面板 -->
  <div id="historyPanel" class="hidden">
    <div class="history-title">最近 10 次抽奖</div>
    <ul id="historyList"></ul>
  </div>

  <!-- 幸运星附体提示 -->
  <div id="lucky">
    <div class="star">⭐</div>
    <div class="msg">幸运星附体</div>
    <div class="sub">连续抽中优惠券效果累乘（8折↔12折），自动开转下一轮</div>
  </div>

<script>
/* ===== 条目：动作名 / 数量 / 规则说明 ===== */
const ITEMS = [
  { name: "金鸡独立", amount: "60秒",  rule: "单脚支撑，除了支撑脚，肢体不能触碰任何外物" },
  { name: "弓步",     amount: "60秒",  rule: "大腿和地面平行，手不能接触外物，身体笔直垂直于地面" },
  { name: "仰卧起坐", amount: "45个",  rule: "每次头碰膝盖，背部要着地" },
  { name: "俯卧撑",   amount: "30个",  rule: "身体平直，起来时手臂伸直，下去时胸部离地面五厘米以内" },
  { name: "平板支撑", amount: "60秒",  rule: "身体平直，保持不动" },
  { name: "深蹲",     amount: "50个",  rule: "" },
  { name: "马步",     amount: "60秒",  rule: "大腿与地面保持平行，小腿与地面保持垂直，身体笔直垂直于地面" },
  { name: "独立思考", amount: "600秒", rule: "自己翻书或者查看资料，独立思考" },
  { name: "观看教学视频", amount: "",  rule: "" },
  { name: "8折优惠券", amount: "", rule: "下一轮抽奖执行数量打8折", factor: 0.8 },
  { name: "12折优惠券", amount: "", rule: "下一轮抽奖执行数量加收12折", factor: 1.2 },
];

const COLORS = [
  "#ff6b6b", "#ffa94d", "#ffd43b", "#51cf66",
  "#22b8cf", "#748ffc", "#b197fc", "#f783ac",
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const resultEl = document.getElementById("result");
const spinBtn = document.getElementById("spin");

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let size = 0;
let currentAngle = 0; // 当前扇区0的中线指向的角度（rad）
let spinning = false;
let couponFactor = 1; // 连续优惠券累乘：<1 打折、>1 加量；抽到普通项目后恢复 1
let luckyStreak = 0;  // 连续抽中 8折券次数（12折券打断）
let freePass = false; // 连续 3 次 8折赠送「免做一次大礼」：下一轮普通项目免做
let spinHistory = [];  // 最近 10 次抽奖记录 [{time, item, note}]

function resize() {
  size = canvas.parentElement.clientWidth;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + "px";
  canvas.style.height = size + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

const slice = () => 2 * Math.PI / ITEMS.length;

function draw() {
  const c = size / 2;
  const r = size / 2 - 2;
  ctx.clearRect(0, 0, size, size);
  for (let i = 0; i < ITEMS.length; i++) {
    const item = ITEMS[i];
    const start = currentAngle + i * slice();
    ctx.beginPath();
    ctx.moveTo(c, c);
    ctx.arc(c, c, r, start, start + slice());
    ctx.closePath();
    ctx.fillStyle = item.factor
      ? (item.factor < 1 ? "#f5c518" : "#c0392b")
      : COLORS[i % COLORS.length];
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.35)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // 文字：沿半径方向居中，两行（名称 / 数量），白字+深色描边保证对比度
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(start + slice() / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    const f1 = Math.max(12, r * 0.115);
    const f2 = Math.max(11, r * 0.095);
    ctx.lineWidth = 4;
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(0,0,0,.55)";
    ctx.fillStyle = "#fff";
    ctx.font = "700 " + f1 + "px system-ui, sans-serif";
    ctx.strokeText(clip(item.name, r * 0.8, f1), r * 0.88, -f1 * 0.42);
    ctx.fillText(clip(item.name, r * 0.8, f1), r * 0.88, -f1 * 0.42);
    if (item.amount) {
      ctx.font = "700 " + f2 + "px system-ui, sans-serif";
      ctx.strokeText(clip(item.amount, r * 0.8, f2), r * 0.88, f2 * 0.75);
      ctx.fillText(clip(item.amount, r * 0.8, f2), r * 0.88, f2 * 0.75);
    }
    ctx.restore();
  }
  // 外圈
  ctx.beginPath();
  ctx.arc(c, c, r, 0, 2 * Math.PI);
  ctx.lineWidth = 6;
  ctx.strokeStyle = "#d9d9ec";
  ctx.stroke();
}

function clip(s, maxWidth, fontSize) {
  const maxLen = Math.max(2, Math.floor(maxWidth / (fontSize * 0.55)));
  return s.length > maxLen ? s.slice(0, maxLen - 1) + "…" : s;
}

function spin() {
  if (spinning || ITEMS.length < 1) return;
  spinning = true;
  spinBtn.disabled = true;
  resultEl.textContent = "转动中…";

  // 上轮（或连续多轮）抽中优惠券的累计系数；本轮抽到普通项目后即恢复原值
  const usingCoupon = couponFactor !== 1;
  const factor = usingCoupon ? couponFactor : 1;

  // 圈数必须是整数：小数圈会把多余角度留在最终位置，导致指针与结果错位
  const extraTurns = 5 + Math.floor(Math.random() * 5); // 5-9 整圈
  const targetSlice = Math.floor(Math.random() * ITEMS.length);
  // 目标扇区中线相对轮盘 0° 的偏移，最终让该中线对准顶部指针（-PI/2）
  const sliceMidOffset = targetSlice * slice() + slice() / 2;
  const targetFinal = -(Math.PI / 2) - sliceMidOffset;
  let delta = targetFinal - currentAngle;
  while (delta <= 0) delta += 2 * Math.PI;
  delta += extraTurns * 2 * Math.PI;

  const start = currentAngle;
  const total = delta;
  const duration = 4200;
  const t0 = performance.now();

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function step(now) {
    const p = Math.min((now - t0) / duration, 1);
    currentAngle = start + total * easeOutCubic(p);
    draw();
    if (p < 1) {
      requestAnimationFrame(step);
    } else {
      currentAngle = currentAngle % (2 * Math.PI);
      spinning = false;
      spinBtn.disabled = false;
      const item = ITEMS[targetSlice];
      // 优惠券系数：数量数值部分 ×factor（<1 折扣、>1 加收），保留原有单位（秒/个）
      let amountText = item.amount;
      let couponNote = "";
      if (usingCoupon && !item.factor && item.amount) {
        const orig = item.amount;
        const m = orig.match(/^([\d.]+)(.*)$/);
        if (m) {
          const calc = Math.round(parseFloat(m[1]) * factor);
          if (calc !== parseFloat(m[1])) {
            amountText = calc + m[2];
            const label = factor < 1
              ? (factor === 0.8 ? "8折" : (Math.round(factor * 1000) / 100) + "折")
              : (factor === 1.2 ? "12折" : (Math.round(factor * 1000) / 100) + "折");
            couponNote = "（" + label + "：" + orig + " → " + amountText + "）";
          }
        }
      }
      // 普通项目消费优惠后恢复原值（无数量项目同样清零）；同时打断 8折连击
      if (!item.factor) {
        couponFactor = 1;
        luckyStreak = 0;
      }
      if (item.factor) {
        couponFactor *= item.factor;
        // 连击计数：8折券 +1，12折券清零
        if (item.factor < 1) {
          luckyStreak++;
        } else {
          luckyStreak = 0;
        }
        // 结果区记录本次抽中优惠券
        resultEl.innerHTML = "🎉 抽中：<span class='hit'>" + escapeHtml(item.name)
          + "</span>　" + escapeHtml(item.rule);
        // 幸运星/霉运附体：显示提示并自动触发下一轮
        const lucky = document.getElementById("lucky");
        const isLucky = item.factor < 1;
        lucky.classList.toggle("bad", !isLucky);
        lucky.querySelector(".star").textContent = isLucky ? "⭐" : "☠️";
        lucky.querySelector(".msg").textContent = isLucky ? "幸运星附体" : "霉运上身";
        lucky.classList.add("show");
        setTimeout(() => {
          lucky.classList.remove("show");
          spin();
        }, 1500);
        // 连续 3 张 8折券：赠送免做一次大礼
        if (item.factor < 1 && luckyStreak >= 3) {
          freePass = true;
          luckyStreak = 0; // 免做奖励后连击重新计数
          resultEl.innerHTML += "<br>🎁 <span style='color:#ffd700'>免做一次大礼！</span>下一轮抽中项目自动免做";
          recordHistory(item.name, "大礼·免做一次");
        } else {
          recordHistory(item.name, item.factor < 1 ? "8折" : "12折");
        }
        return;
      }
      // 免做：连续 3 张 8折券赠送，本轮普通项目直接豁免
      if (freePass) {
        freePass = false;
        recordHistory(item.name + (item.amount ? " " + item.amount : ""), "免做");
        resultEl.innerHTML = "🛡 <span class='hit'>免做：</span>" + escapeHtml(item.name)
          + (item.amount ? "　" + escapeHtml(item.amount) : "")
          + "　<em>大礼生效，本轮无需执行</em>";
        return;
      }
      const ruleText = item.rule ? "　" + item.rule : "";
      recordHistory(item.name + (amountText ? " " + amountText : ""), couponNote.replace(/[（）]/g, ""));
      resultEl.innerHTML = "🎉 抽中：<span class='hit'>" + escapeHtml(item.name)
        + (amountText ? "　" + escapeHtml(amountText) : "")
        + "</span>" + escapeHtml(ruleText) + escapeHtml(couponNote);
    }
  }
  requestAnimationFrame(step);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

// 记录最近 10 次抽奖（最新在前）
function recordHistory(item, note) {
  const now = new Date();
  const time = now.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  spinHistory.unshift({ time, item, note });
  if (spinHistory.length > 10) spinHistory.pop();
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById("historyList");
  list.innerHTML = "";
  for (const h of spinHistory) {
    const li = document.createElement("li");
    const left = document.createElement("span");
    left.className = "h-item";
    left.textContent = h.item;
    const right = document.createElement("span");
    right.className = "h-note";
    right.textContent = (h.note ? h.note + " · " : "") + h.time;
    li.appendChild(left);
    li.appendChild(right);
    list.appendChild(li);
  }
}

const historyBtn = document.getElementById("historyBtn");
const historyPanel = document.getElementById("historyPanel");
historyBtn.addEventListener("click", () => {
  historyPanel.classList.toggle("hidden");
});
// 点击面板外部关闭
document.addEventListener("click", (e) => {
  if (!historyPanel.classList.contains("hidden") &&
      !historyPanel.contains(e.target) &&
      !historyBtn.contains(e.target)) {
    historyPanel.classList.add("hidden");
  }
});

spinBtn.addEventListener("click", spin);
window.addEventListener("resize", resize);
resize();
</script>
</body>
</html>
